name: Android release (pin-gated)

# Org release gate for certificate pinning.
#
# Contract (public repo, private secrets):
# - The committed network_security_config.xml ships system CAs (no pin-set):
#   placeholder pins fail closed and brick TLS, so the tree never carries fake
#   digests. Real pins live only in the org secret ANDROID_CERT_PINS
#   ("<current>,<backup>" base64 SHA-256 SPKI hashes).
# - This lane runs only on the org repository. Forks and public clones never
#   receive org secrets (GitHub does not expose secrets to forks), and the
#   repository guard below keeps the lane from failing their pipelines. Third
#   parties targeting their own backend re-enable it by editing the
#   `if:` guard (or setting the repository variable) and supplying their own
#   ANDROID_CERT_PINS secret plus their own endpoints in
#   config/network/endpoints.json — the app is config-driven and works
#   against any conforming database/backend.
# - On the org repo the gate FAILS when the secret is missing or malformed:
#   an org release cannot ship unpinned. The stamp script refuses single
#   pins and placeholder values (scripts/stamp-android-cert-pins.sh).
#
# Pin recipe and rotation policy: docs/config/CERTIFICATE_PINNING_SETUP.md

on:
  workflow_dispatch:
  push:
    tags: ['release-*']

permissions:
  contents: read

jobs:
  pin-gated-release:
    # Org repo only. Forks skip this lane entirely instead of failing on a
    # secret they cannot have; see the contract comment above to re-enable
    # against your own backend and pins.
    if: github.repository == 'CB-st/CipherBank-App'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      ANDROID_CERT_PINS: ${{ secrets.ANDROID_CERT_PINS }}
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Require release pins (fail closed)
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_CERT_PINS}" ]; then
            echo "::error::ANDROID_CERT_PINS secret is unset. An org release cannot ship unpinned." >&2
            echo "Provide '<current>,<backup>' base64 SHA-256 SPKI hashes (recipe:" >&2
            echo "docs/config/CERTIFICATE_PINNING_SETUP.md). Forks: this lane is org-only;" >&2
            echo "see the workflow header to run it against your own backend." >&2
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            10.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Stamp certificate pins
        run: |
          set -euo pipefail
          ./scripts/stamp-android-cert-pins.sh
          # The stamp script validates two base64 SHA-256 digests and rejects
          # placeholders; verify the pin-set actually landed before building.
          grep -q "<pin-set" CipherBank-app/Platforms/Android/Resources/xml/network_security_config.xml

      - name: Build pinned Release APK (deployment test, unsigned)
        run: |
          set -euo pipefail
          dotnet build CipherBank-app/CipherBank-app.csproj \
            -c Release -f net10.0-android --nologo \
            -p:AndroidPackageFormats=apk

      - name: Collect APK artifact
        run: |
          set -euo pipefail
          mkdir -p artifact-apk
          find CipherBank-app/bin/Release -name "*.apk" -exec cp -f {} artifact-apk/ \;
          ls -l artifact-apk

      - name: Upload pinned APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cipherbank-android-pinned-${{ github.sha }}
          path: artifact-apk/
          if-no-files-found: error
          retention-days: 14
